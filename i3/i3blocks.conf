#~/.config/i3/
# Created by: schanver

[pacman-updates]
command=$HOME/.scripts/arch-update
markup=pango
interval=3600
format=plain

[aur-update]
command=$HOME/.scripts/aur-update
markup=pango
format=json
interval=43200
UPDATE_COLOR=red
QUIET=1
IGNORE=root vidyodesktop
#CACHE_UPDATES=0
FORCE_IPV4=1

[battery]
command=$HOME/.scripts/battery
interval=30
LABEL=BAT 
#LABEL=⚡
BAT_NUMBER=0

[temperature]
command=$HOME/.scripts/temperature
label=TEMP 
interval=10
T_WARN=70
T_CRIT=90
#SENSOR_CHIP=""

[time]
command=$HOME/.scripts/time
interval=60
markup=none
