include /home/mfs/dotfiles/.config/kitty/themes/black_metal_gorgoroth.conf

allow_remote_control yes

map super+u           set_background_opacity 1
map super+shift+u     set_background_opacity default
map super+shift+i     set_background_opacity 0.7

font_family Iosevka Term
font_family Iosevka Nerd Font Mono
font_size 22
text_composition_strategy legacy
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
hide_window_decorations no
window_padding_width 0
window_padding_height 0
background_blur 20
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.01 0.15
cursor_blink true
cursor_shape block        
cursor_underline_thickness 1.0

background_opacity 0.9
#set_background_opacity 0.95


# BEGIN_KITTY_THEME
# Spacemacs
include current-theme.conf
# END_KITTY_THEME
