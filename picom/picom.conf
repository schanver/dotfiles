
#################################
# Backend
#################################

backend = "glx";          # Use OpenGL for performance and effects
vsync = true;

#################################
# Shadow
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.3;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "name = 'Notification'",
  "name *= 'Conky'",
  "name = 'cairo-clock'",
  "class_g ?= 'notify-osd'",
  "class_g = 'slop'",
  "class_g = 'XTerm'"
];

#################################
# Fading
#################################

fading = true;
fade-delta = 10;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-exclude = [];

#################################
# Transparency
#################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Code'"
];

#################################
# Blur (requires ibhagwan fork)
#################################

blur:
{
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = true;
  background-fixed = true;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
# Rounded Corners
#################################

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Animations (ibhagwan fork only)
#################################

animations = true;
animation-stiffness = 200;
animation-dampening = 15;
animation-window-mass = 0.5;
animation-for-open-window = "zoom";
animation-for-unmap-window = "fade-out";
animation-for-transient-window = "slide-down";

#################################
# Other Settings
#################################

use-dock-shadow = false;
detect-client-opacity = true;
detect-rounded-corners = true;
log-level = "warn";
