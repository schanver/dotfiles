.container {

ul {

    padding-left: 2.5rem;
    white-space:nowrap;
}

li {
    position: relative;
}

li::before, li::after {
    content: "";
    position: absolute;
    left: -0.75rem;
}

li::before {
    border-top: var(--branch);
    top: 0.75rem;
    width: 0.5rem;
}

li::after {
    border-left: var(--branch);
    height: 100%;
    top: 0.25rem;
}

li:last-child::after {
    height: 0.5rem;
}

a {
    font-family: var(--font);
    font-size: 1rem;
    color: var(--color6);
    text-decoration: none;
    outline: none;
}

a:hover {
    color: var(--color12);
    background: var(--background);
}

form h1 {

}

input {

    color: var(--color6);
    background-color: var(--background);
    border-width: 1px;
    border-color: var(--color12);
    border-style: solid;
    padding-top: 4px;
    padding-bottom: 4px;
}

.column {
  flex: 50%;
  padding: 5px;
}

.row {
  display: flex;
}

.row:after {
  content: "";
  display: table;
  clear: both;
}
